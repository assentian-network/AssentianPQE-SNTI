# Deploy as: /etc/systemd/system/assentian-seed.service.d/miner-wants.conf
#
# Auto-safeguard: whenever the seed node service is started (including
# manual resync procedures that stop/start it), pull the miner(s) back up
# with it. Prevents the miner silently staying dead after a node restart,
# since the miner units' Requires= only propagates STOP, never auto-restart.
[Unit]
Wants=assentian-vps-miner.service assentian-seed-miner.service
