# Deploy as: /etc/systemd/system/assentian-mainnet-node.service.d/miner-wants.conf
#
# Auto-safeguard: whenever the node service is started (including manual
# resync procedures that stop/start it), pull the miner back up with it.
# Prevents the miner silently staying dead after a node restart, since
# the miner's own Requires= only propagates STOP, never auto-restart.
[Unit]
Wants=assentian-vps-miner.service
