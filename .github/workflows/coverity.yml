name: "Coverity Scan"

on:
  push:
    branches: [ "main" ]
  schedule:
    # Weekly, Monday 04:00 UTC (Coverity Scan free tier caps builds/week, stay well under).
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

jobs:
  coverity:
    name: Build & submit to Coverity Scan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.repository == 'assentian-network/AssentianPQE-SNTI'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 curl sqlite3 \
            libevent-dev libssl-dev libsqlite3-dev \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libboost-test-dev libboost-thread-dev

      - name: Download Coverity Build Tool
        env:
          COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --data-urlencode "project=AssentianPQE-SNTI" \
            --data-urlencode "token=${COVERITY_SCAN_TOKEN}" \
            -o cov-analysis.tgz \
            https://scan.coverity.com/download/linux64
          mkdir cov-analysis
          tar xzf cov-analysis.tgz --strip-components=1 -C cov-analysis

      - name: Configure (matches production configure flags)
        run: |
          ./autogen.sh
          ./configure \
            --disable-bench --without-gui --disable-zmq --disable-shared \
            --with-pic --enable-benchmark=no --enable-module-recovery \
            --disable-module-ecdh --without-miniupnpc --without-natpmp \
            --enable-tests

      - name: Build under cov-build
        run: |
          export PATH="$PWD/cov-analysis/bin:$PATH"
          # Only capture the binaries that actually ship to production —
          # a plain `make` also builds test_bitcoin + fuzz targets, which
          # bloats cov-int well past Coverity Scan's free-tier upload limit
          # (previous run hit HTTP 413) without adding relevant coverage.
          cov-build --dir cov-int make -j"$(nproc)" -C src bitcoind bitcoin-cli bitcoin-tx bitcoin-wallet

      - name: Scope cov-int to SNTI's own code
        run: |
          export PATH="$PWD/cov-analysis/bin:$PATH"
          # Diagnosed 27 Jul 2026 (run 30274125254): cov-int's ~787M is
          # essentially ONE file, cov-int/emit/*/emit-db (761.8M, a SQLite
          # database) -- not scattered per-TU bloat. Deleting TUs with
          # `cov-manage-emit ... delete` only removes logical rows; it does
          # NOT shrink the file (SQLite doesn't reclaim freed pages without
          # VACUUM), which is why the earlier vendor-only strip (98/612 TUs)
          # measured zero byte change even though it "succeeded". And the
          # remaining size isn't hidden bloat either -- it's legitimately
          # the preprocessed source + debug info for ~514 real (non-vendor)
          # translation units of a full Bitcoin Core build, most of which
          # pull in heavily templated Boost/OpenSSL headers per TU. That's
          # inherent to analyzing the whole inherited codebase, not a bug.
          #
          # Fix: stop trying to fit the whole inherited codebase under the
          # 500MB free-tier cap (scan.coverity.com/faq.html) and instead
          # permanently scope Coverity to the code SNTI actually authored
          # or modified -- the only code we'd act on findings for anyway
          # (same rationale CodeQL triage already uses for vendor dirs).
          # Keep-list below was generated by diffing this tree against
          # upstream bitcoin/bitcoin tag v27.0 (this fork's exact base
          # version, confirmed via configure.ac CLIENT_VERSION and the
          # /Satoshi:27.0.0/ P2P subver), not guessed from memory: 23
          # modified .cpp files + 18 new XMSS/PoUW .c/.cpp files, ~41 of
          # 514 non-vendor TUs.
          KEEP='.*/(addresstype\.cpp|kernel/chainparams\.cpp|key_io\.cpp|node/blockstorage\.cpp|node/interfaces\.cpp|policy/policy\.cpp|pow\.cpp|rpc/blockchain\.cpp|rpc/mining\.cpp|rpc/net\.cpp|rpc/rawtransaction\.cpp|rpc/util\.cpp|script/interpreter\.cpp|script/script\.cpp|script/sign\.cpp|script/solver\.cpp|validation\.cpp|wallet/rpc/addresses\.cpp|wallet/rpc/backup\.cpp|wallet/rpc/wallet\.cpp|wallet/scriptpubkeyman\.cpp|wallet/spend\.cpp|wallet/wallet\.cpp|wallet/walletdb\.cpp|fips202\.c|hash_address\.c|params\.c|randombytes\.c|utils\.c|wots\.c|xmss\.c|xmss_bridge\.cpp|xmss_commons\.c|xmss_core\.c|xmss_core_fast\.c|xmss_hash\.c|xmss_sha_wrapper\.cpp|xmss_tree_ledger\.cpp|wallet/xmss_address\.cpp|wallet/xmss_keystore\.cpp|wallet/xmss_signer\.cpp|wallet/rpc/xmss\.cpp)$'

          echo "cov-int size before scoping:"
          du -sh cov-int
          echo "TUs before: $(cov-manage-emit --dir cov-int list | wc -l)"

          # Single delete, inverse-selected via negative lookahead (proven
          # syntax from the earlier vendor-strip run, just a richer
          # pattern) -- deletes every TU whose primary source file does
          # NOT end in one of the keep-list paths above.
          cov-manage-emit --dir cov-int \
            --tu-pattern "file('^(?!$KEEP).*')" \
            delete

          echo "TUs after: $(cov-manage-emit --dir cov-int list | wc -l)"
          echo "cov-int size after delete (expected: unchanged, SQLite doesn't reclaim on delete):"
          du -sh cov-int

          echo "VACUUMing emit-db to actually reclaim the freed space:"
          for db in cov-int/emit/*/emit-db; do
            echo "  before: $(du -h "$db" | cut -f1)  $db"
            sqlite3 "$db" 'VACUUM;'
            echo "  after:  $(du -h "$db" | cut -f1)  $db"
          done

          echo "cov-int size after VACUUM:"
          du -sh cov-int
          echo "cov-int top-level breakdown:"
          du -h --max-depth=1 cov-int | sort -rh

      - name: Package build artifacts
        run: |
          tar czf cov-int.tgz cov-int
          du -sh cov-int.tgz

      - name: Submit build to Coverity Scan
        env:
          COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          COVERITY_SCAN_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
        run: |
          curl --fail --silent --show-error \
            --form token="${COVERITY_SCAN_TOKEN}" \
            --form email="${COVERITY_SCAN_EMAIL}" \
            --form file=@cov-int.tgz \
            --form version="$(git rev-parse --short HEAD)" \
            --form description="GitHub Actions build ${{ github.run_number }} (${{ github.sha }})" \
            "https://scan.coverity.com/builds?project=AssentianPQE-SNTI"
